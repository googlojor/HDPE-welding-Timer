<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>ПНД Таймер</title>
<style>
  :root {
    --bg: #ffffff;
    --text: #1f1f1f;
    --text-muted: #747775;
    --blue: #0b57d0;
    --blue-light: #e8f0fe;
    --blue-hover: #d3e3fd;
    --border: #e0e0e0;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Roboto', system-ui, -apple-system, sans-serif; -webkit-tap-highlight-color: transparent; }
  body { background: var(--bg); color: var(--text); height: 100vh; overflow: hidden; display: flex; flex-direction: column; }
  
  /* Общие стили экранов */
  .screen { display: none; flex-direction: column; height: 100%; padding: env(safe-area-inset-top) 20px 20px 20px; }
  .screen.active { display: flex; }
  .header { display: flex; justify-content: space-between; align-items: center; height: 60px; font-size: 20px; font-weight: 500; }
  .icon-btn { background: none; border: none; color: var(--text-muted); padding: 10px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
  .icon-btn:active { background: #f0f0f0; border-radius: 50%; }

  /* ЭКРАН НАСТРОЕК (Колесики) */
  .setup-content { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 30px; }
  .wheels-container { display: flex; gap: 20px; width: 100%; justify-content: center; height: 250px; position: relative; }
  .wheel-wrapper { flex: 1; display: flex; flex-direction: column; align-items: center; position: relative; }
  .wheel-label { font-size: 14px; color: var(--text-muted); margin-bottom: 10px; text-transform: uppercase; letter-spacing: 1px; }
  .wheel {
    height: 200px; width: 100%; overflow-y: auto; scroll-snap-type: y mandatory;
    scrollbar-width: none; -ms-overflow-style: none; position: relative;
    mask-image: linear-gradient(to bottom, transparent, black 20%, black 80%, transparent);
    -webkit-mask-image: linear-gradient(to bottom, transparent, black 20%, black 80%, transparent);
  }
  .wheel::-webkit-scrollbar { display: none; }
  .wheel-item {
    height: 50px; display: flex; align-items: center; justify-content: center;
    font-size: 24px; color: var(--text-muted); scroll-snap-align: center;
    transition: all 0.2s;
  }
  .wheel-item.selected { font-size: 32px; color: var(--text); font-weight: 500; }
  .wheel-highlight { position: absolute; top: 50%; left: 0; right: 0; height: 50px; transform: translateY(-50%); border-top: 1px solid var(--border); border-bottom: 1px solid var(--border); pointer-events: none; }
  .params-mini { display: flex; gap: 15px; justify-content: center; color: var(--text-muted); font-size: 14px; margin-top: 10px;}
  .btn-start-large {
    width: 80px; height: 80px; border-radius: 50%; background: var(--blue); color: white;
    border: none; display: flex; align-items: center; justify-content: center; cursor: pointer;
    box-shadow: 0 4px 12px rgba(11,87,208,0.3); margin-bottom: 20px;
  }
  .btn-start-large:active { transform: scale(0.95); background: #0842a0; }

  /* ЭКРАН ТАЙМЕРА */
  .timer-content { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; }
  .timer-svg { width: 300px; height: 300px; transform: rotate(-90deg); }
  .timer-bg { stroke: #e0e0e0; stroke-width: 2; fill: none; }
  .timer-progress { stroke: var(--blue); stroke-width: 3; fill: none; stroke-linecap: round; transition: stroke-dashoffset 0.3s linear; }
  .timer-text-overlay { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); text-align: center; width: 100%; }
  .phase-name { font-size: 16px; color: var(--text-muted); margin-bottom: 5px; }
  .time-display { font-size: 56px; font-weight: 300; font-variant-numeric: tabular-nums; line-height: 1; letter-spacing: -1px; }
  .controls-timer { display: flex; gap: 30px; margin-top: 40px; align-items: center; justify-content: center; }
  .btn-circle {
    width: 64px; height: 64px; border-radius: 50%; background: var(--blue-light); color: var(--blue);
    border: none; display: flex; align-items: center; justify-content: center; cursor: pointer;
  }
  .btn-circle:active { background: var(--blue-hover); }
  .btn-circle.small { width: 48px; height: 48px; background: #f0f0f0; color: var(--text-muted); }
  .btn-circle.small.active { color: var(--blue); background: var(--blue-light); }

  /* ЖУРНАЛ */
  .log-list { flex: 1; overflow-y: auto; padding-bottom: 20px; }
  .log-item { padding: 15px 0; border-bottom: 1px solid var(--border); }
  .log-item-title { font-weight: 500; margin-bottom: 5px; }
  .log-item-desc { font-size: 13px; color: var(--text-muted); display: flex; gap: 10px; flex-wrap: wrap; }
</style>
</head>
<body>

<!-- ЭКРАН 1: НАСТРОЙКИ -->
<div id="screen-setup" class="screen active">
  <div class="header">
    <div>Таймер сварки</div>
    <button class="icon-btn" onclick="showScreen('screen-log')">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
    </button>
  </div>

  <div class="setup-content">
    <div class="wheels-container">
      <div class="wheel-wrapper">
        <div class="wheel-label">Ø, мм</div>
        <div class="wheel" id="wheel-dia" onscroll="handleScroll('dia')"></div>
      </div>
      <div class="wheel-wrapper">
        <div class="wheel-label">SDR</div>
        <div class="wheel" id="wheel-sdr" onscroll="handleScroll('sdr')"></div>
      </div>
    </div>
    <div class="wheel-highlight" style="position: absolute; width: 70%; top: 250px; display: none;"></div>

    <div class="params-mini" id="mini-params">
      Стенка: — | Охлажд: —
    </div>
  </div>

  <div style="display: flex; justify-content: center;">
    <button class="btn-start-large" onclick="startWelding()">
      <svg width="32" height="32" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
    </button>
  </div>
</div>

<!-- ЭКРАН 2: ТАЙМЕР -->
<div id="screen-timer" class="screen">
  <div class="header">
    <button class="icon-btn" onclick="stopWelding()">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
    </button>
    <div>Сварка</div>
    <div style="width: 44px;"></div> <!-- Заглушка для центрирования -->
  </div>

  <div class="timer-content">
    <svg class="timer-svg" viewBox="0 0 200 200">
      <circle class="timer-bg" cx="100" cy="100" r="90"></circle>
      <!-- Прогресс-бар (в JS управляем stroke-dasharray) -->
      <circle class="timer-progress" id="timer-progress" cx="100" cy="100" r="90" stroke-dasharray="565.48" stroke-dashoffset="0"></circle>
    </svg>
    
    <div class="timer-text-overlay">
      <div class="phase-name" id="phase-display">Нагрев</div>
      <div class="time-display" id="time-display">00:00</div>
    </div>

    <div class="controls-timer">
      <button class="btn-circle small" id="btn-sound" onclick="toggleSound()">
        <svg id="icon-sound" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18V5l12-2v13M9 9l12-2M6 18a3 3 0 1 1-6 0 3 3 0 0 1 6 0z"/></svg>
      </button>
      
      <button class="btn-circle" id="btn-play-pause" onclick="togglePause()">
        <svg id="icon-pause" width="32" height="32" viewBox="0 0 24 24" fill="currentColor"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
      </button>
      
      <button class="btn-circle small" onclick="stopWelding()">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h12v12H6z"/></svg>
      </button>
    </div>
  </div>
</div>

<!-- ЭКРАН 3: ЖУРНАЛ -->
<div id="screen-log" class="screen">
  <div class="header">
    <button class="icon-btn" onclick="showScreen('screen-setup')">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
    </button>
    <div>Журнал</div>
    <div style="width: 44px;"></div>
  </div>
  <div class="log-list" id="log-list"></div>
</div>

<script>
console.log('Скрипт запущен (Новый дизайн)');

// ==== ДАННЫЕ ====
const DIAMETERS = [20,25,32,40,50,63,75,90,110,125,140,160,180,200,225,250,280,315,355,400];
const SDRS = [33,26,17,11,9,7.4,6];
const TEMP_CORRECTION = [
  {key:'cold', label:'≤ 15°C',  factor: 0.8},
  {key:'norm', label:'15–25°C', factor: 1.0},
  {key:'hot',  label:'25–40°C', factor: 1.2},
];
let currentTemp = TEMP_CORRECTION[1]; // По умолчанию норм

let selectedDia = 110;
let selectedSdr = 11;
let P = {};

// ==== КОЛЕСИКИ ====
function initWheels() {
  const wDia = document.getElementById('wheel-dia');
  const wSdr = document.getElementById('wheel-sdr');
  
  // Добавляем пустые элементы сверху и снизу, чтобы можно было центрировать
  const pad = `<div class="wheel-item"></div><div class="wheel-item"></div>`;
  
  wDia.innerHTML = pad + DIAMETERS.map(d => `<div class="wheel-item" data-val="${d}">${d}</div>`).join('') + pad;
  wSdr.innerHTML = pad + SDRS.map(s => `<div class="wheel-item" data-val="${s}">${s}</div>`).join('') + pad;

  // Прокрутка к дефолтным значениям
  setTimeout(() => {
    wDia.scrollTop = (DIAMETERS.indexOf(selectedDia) + 2) * 50 - 75;
    wSdr.scrollTop = (SDRS.indexOf(selectedSdr) + 2) * 50 - 75;
    updateMiniParams();
  }, 100);
}

function handleScroll(type) {
  const el = document.getElementById(type === 'dia' ? 'wheel-dia' : 'wheel-sdr');
  clearTimeout(el.timer);
  el.timer = setTimeout(() => {
    const index = Math.round((el.scrollTop + 75) / 50) - 2;
    const data = type === 'dia' ? DIAMETERS : SDRS;
    
    if(index >= 0 && index < data.length) {
      if(type === 'dia') selectedDia = data[index];
      else selectedSdr = data[index];
      
      // Подсветка
      Array.from(el.children).forEach(c => c.classList.remove('selected'));
      el.children[index + 2].classList.add('selected');
      
      updateMiniParams();
    }
  }, 100);
}

function updateMiniParams() {
  const e = selectedDia / selectedSdr;
  const cool = Math.round(60 * e * currentTemp.factor);
  document.getElementById('mini-params').textContent = 
    `Стенка: ${e.toFixed(1)} мм | Охлажд: ${Math.round(cool/60)} мин`;
  
  // Пересчитываем P
  P = {
    D: selectedDia, sdr: selectedSdr, e: e,
    heat: Math.max(5, Math.round(10 * e)),
    pause: Math.min(12, Math.max(4, Math.round(4 + 0.4 * e))),
    weld: Math.min(8,  Math.max(3, Math.round(3 + 0.3 * e))),
    cool: cool
  };
}

// ==== НАВИГАЦИЯ ====
function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  if(id === 'screen-log') renderLog();
}

// ==== ТАЙМЕР ====
const PHASES = [
  {key:'heat',  name:'Нагрев',     sec:()=>P.heat,  color:'#f59e0b'},
  {key:'pause', name:'Техпауза',   sec:()=>P.pause, color:'#ef4444'},
  {key:'weld',  name:'Осадка',     sec:()=>P.weld,  color:'#a855f7'},
  {key:'cool',  name:'Охлаждение', sec:()=>P.cool,  color:'#3b82f6'},
];

let phaseIdx = -1, remaining = 0, total = 1, running = false;
let intervalId = null, endAt = 0, preWarned = false;
let soundEnabled = true;

const timeDisplay = document.getElementById('time-display');
const phaseDisplay = document.getElementById('phase-display');
const progressBar = document.getElementById('timer-progress');
const CIRCUMFERENCE = 2 * Math.PI * 90; // 565.48

function fmt(sec) {
  const s = Math.max(0, Math.ceil(sec));
  return String(Math.floor(s/60)).padStart(2,'0') + ':' + String(s%60).padStart(2,'0');
}

function updateDisplay() {
  timeDisplay.textContent = fmt(remaining);
  const progress = 1 - (remaining / total);
  progressBar.style.strokeDashoffset = CIRCUMFERENCE * progress;
  
  // Меняем цвет прогресса под фазу
  if(phaseIdx >= 0 && phaseIdx < PHASES.length) {
     progressBar.style.stroke = PHASES[phaseIdx].color;
  }
}

function startWelding() {
  ensureAudio();
  showScreen('screen-timer');
  phaseIdx = -1;
  startPhase(0);
}

function startPhase(i) {
  phaseIdx = i;
  if (i >= PHASES.length) { finish(); return; }
  const ph = PHASES[i];
  total = ph.sec(); remaining = total;
  endAt = performance.now() + total * 1000;
  preWarned = false; running = true;
  
  phaseDisplay.textContent = ph.name;
  document.getElementById('icon-pause').innerHTML = '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>'; // Пауза
  updateDisplay(); 
  startTicking();
}

function togglePause() {
  if (running) {
    running = false; stopTicking();
    document.getElementById('icon-pause').innerHTML = '<path d="M8 5v14l11-7z"/>'; // Плей
  } else {
    running = true;
    endAt = performance.now() + remaining * 1000;
    preWarned = false;
    document.getElementById('icon-pause').innerHTML = '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>'; // Пауза
    startTicking();
  }
}

function stopWelding() {
  running = false; stopTicking();
  showScreen('screen-setup');
}

function finish() {
  running = false; stopTicking();
  showScreen('screen-setup');
  if (navigator.vibrate) navigator.vibrate([100,80,100,80,400]);
  // Автосохранение
  if (confirm('Стык завершён. Сохранить в журнал?')) saveToLog();
}

function tick() {
  if (!running) return;
  const rem = Math.max(0, (endAt - performance.now()) / 1000);
  remaining = rem;
  updateDisplay();
  
  if (!preWarned && total > 5 && rem > 0 && rem <= 3.05) { 
    preWarned = true; 
    if(soundEnabled) { beep(1200, 0.12, 0.4); setTimeout(() => beep(1200, 0.12, 0.4), 200); }
  }
  
  if (rem <= 0) { 
    running = false; stopTicking(); 
    if(soundEnabled) alarm(); 
    else if(navigator.vibrate) navigator.vibrate([200,100,200,100,350]);
    startPhase(phaseIdx + 1); 
  }
}

function startTicking() { stopTicking(); intervalId = setInterval(tick, 100); }
function stopTicking() { if (intervalId) { clearInterval(intervalId); intervalId = null; } }


// ==== ЗВУК ====
let audioCtx;
function ensureAudio() {
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    return audioCtx;
  } catch(e) { return null; }
}

function beep(freq, dur, vol) {
  const ac = ensureAudio(); if (!ac) return;
  const o = ac.createOscillator(), g = ac.createGain();
  o.frequency.value = freq; o.type = 'sine';
  g.gain.setValueAtTime(vol, ac.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + dur);
  o.connect(g).connect(ac.destination); o.start(); o.stop(ac.currentTime + dur);
}

function alarm() {
  const ac = ensureAudio(); if (!ac) return;
  const now = ac.currentTime;
  const dur = 4;
  const comp = ac.createDynamicsCompressor();
  comp.threshold.setValueAtTime(-50, now); comp.ratio.setValueAtTime(12, now); comp.connect(ac.destination);
  const master = ac.createGain();
  master.gain.setValueAtTime(1.0, now); master.gain.setValueAtTime(0.001, now + dur); master.connect(comp);
  
  for (let rep = 0; rep < 5; rep++) {
    const base = now + rep * 0.8;
    [880, 1100, 1320, 1100].forEach((f, i) => {
      const o = ac.createOscillator(), g = ac.createGain();
      o.type = 'square'; o.frequency.setValueAtTime(f, base + i * 0.2);
      g.gain.setValueAtTime(0.25, base + i * 0.2);
      g.gain.exponentialRampToValueAtTime(0.01, base + i * 0.2 + 0.18);
      o.connect(g).connect(master); o.start(base + i * 0.2); o.stop(base + i * 0.2 + 0.2);
    });
  }
  const bass = ac.createOscillator(), bassGain = ac.createGain();
  bass.type = 'sawtooth'; bass.frequency.setValueAtTime(110, now);
  bassGain.gain.setValueAtTime(0.15, now); bassGain.gain.exponentialRampToValueAtTime(0.01, now + dur);
  bass.connect(bassGain).connect(master); bass.start(now); bass.stop(now + dur);
  
  if (navigator.vibrate) navigator.vibrate([500, 200, 500, 200, 500]);
}

function toggleSound() {
  soundEnabled = !soundEnabled;
  const btn = document.getElementById('btn-sound');
  if(soundEnabled) {
    btn.classList.add('active');
    ensureAudio(); // Разбудить аудио-контекст
  } else {
    btn.classList.remove('active');
  }
}

// ==== ЖУРНАЛ ====
const STORAGE_KEY = 'pnd_welding_log_v3';
function getLog() {
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]'); } catch(e) { return []; }
}

function saveToLog() {
  const log = getLog();
  log.unshift({
    id: Date.now(), date: new Date().toISOString(), standard: 'DVS 2207-1',
    D: P.D, sdr: P.sdr, e: +P.e.toFixed(1), temp: currentTemp.label,
    heat: P.heat, pause: P.pause, weld: P.weld, cool: P.cool,
  });
  if (log.length > 200) log.length = 200;
  localStorage.setItem(STORAGE_KEY, JSON.stringify(log));
}

function renderLog() {
  const list = document.getElementById('log-list');
  const log = getLog();
  if(log.length === 0) {
    list.innerHTML = '<div style="text-align:center; color:#747775; margin-top:50px;">Журнал пуст</div>';
    return;
  }
  list.innerHTML = log.map(e => `
    <div class="log-item">
      <div class="log-item-title">Ø${e.D} SDR${e.sdr} <span style="font-weight:400; color:#747775; font-size:13px;">(${e.e} мм)</span></div>
      <div class="log-item-desc">
        <span>${new Date(e.date).toLocaleString('ru-RU')}</span>
        <span>Нагрев: ${e.heat}с</span>
        <span>Охлажд: ${(e.cool/60).toFixed(1)}м</span>
      </div>
    </div>
  `).join('');
}

// ==== ИНИЦИАЛИЗАЦИЯ ====
initWheels();
document.getElementById('btn-sound').classList.add('active'); // Вкл звук по умолчанию

</script>
</body>
</html>
