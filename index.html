<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ПНД Таймер — Скачать</title>
<style>
  :root {
    --bg: #0a2a30; /* Темный фон, как на заставке */
    --card: #113b43;
    --text: #e2e8f0;
    --muted: #94a3b8;
    --accent: #f97316; /* Оранжевый акцент */
  }
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
  body {
    background: radial-gradient(circle at top, #114a54, var(--bg) 70%);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .container {
    background: var(--card);
    border: 1px solid #1e4e57;
    border-radius: 24px;
    padding: 40px 30px;
    max-width: 400px;
    width: 100%;
    text-align: center;
    box-shadow: 0 20px 40px rgba(0,0,0,0.4);
  }
  .app-icon {
    width: 120px;
    height: 120px;
    border-radius: 24px;
    margin-bottom: 20px;
    box-shadow: 0 8px 16px rgba(0,0,0,0.3);
  }
  h1 {
    font-size: 24px;
    font-weight: 800;
    margin-bottom: 8px;
    letter-spacing: -0.5px;
  }
  .subtitle {
    font-size: 14px;
    color: var(--muted);
    margin-bottom: 30px;
    line-height: 1.4;
  }
  .features {
    text-align: left;
    margin-bottom: 30px;
    font-size: 14px;
    line-height: 1.6;
    color: #cbd5e1;
  }
  .features li {
    list-style: none;
    margin-bottom: 8px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .features li::before {
    content: '✓';
    color: var(--accent);
    font-weight: bold;
  }
  .download-btn {
    display: block;
    background: var(--accent);
    color: #fff;
    text-decoration: none;
    padding: 18px;
    border-radius: 16px;
    font-size: 18px;
    font-weight: 700;
    transition: transform 0.1s, background 0.2s;
    box-shadow: 0 8px 20px rgba(249, 115, 22, 0.3);
  }
  .download-btn:active {
    transform: scale(0.97);
    background: #ea580c;
  }
  .version {
    margin-top: 16px;
    font-size: 12px;
    color: var(--muted);
  }
</style>
</head>
<body>

<div class="container">
  <img src="./icon.png" alt="Иконка ПНД Таймер" class="app-icon">
  <h1>ПНД Таймер</h1>
  <p class="subtitle">Профессиональный помощник для сварки полиэтиленовых труб</p>

  <ul class="features">

  <p class="version">Версия 1.1.0 • Требуется Android 7.0+</p>
</div>

</body>
</html>
